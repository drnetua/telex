# Local development against `docker compose up -d` at the repo root.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${TELEX_DB_PORT:5432}/telex
    username: telex
    password: telex

telex:
  telegram:
    sessions-dir: ${TELEX_TELEGRAM_SESSIONS_DIR:build/tdlib}
  webauthn:
    # The Vite dev server origin (ADR-0006): passkeys work through `pnpm dev` only in the local profile.
    extra-origins: http://localhost:5173
