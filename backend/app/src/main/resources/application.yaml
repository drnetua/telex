spring:
  application:
    name: telex
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false # event_publication comes from the Flyway baseline
telex:
  public-url: ${TELEX_PUBLIC_URL:http://localhost:8080}
