server:
  forward-headers-strategy: framework
  compression:
    enabled: true # the SPA bundle (about 1 MB raw) must load within the shell budget on a phone network
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1KB
spring:
  application:
    name: telex
  threads:
    virtual:
      enabled: true
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${TELEX_MAIL_HOST:localhost}
    port: ${TELEX_MAIL_PORT:1025}
    username: ${TELEX_MAIL_USERNAME:}
    password: ${TELEX_MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.starttls.enable: ${TELEX_MAIL_STARTTLS:false} # true for real relays on 587 (Brevo, Gmail)
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false # event_publication comes from the Flyway baseline
management:
  health:
    mail:
      enabled: false # a down SMTP relay must not mark the app unhealthy
telex:
  master-key: ${TELEX_MASTER_KEY:}
  master-key-reset: ${TELEX_MASTER_KEY_RESET:false}
  telegram:
    adapter: ${TELEX_TELEGRAM_ADAPTER:tdlight} # `fake` is for local development and tests, never for real use
    api-id: ${TELEX_TELEGRAM_API_ID:}
    api-hash: ${TELEX_TELEGRAM_API_HASH:}
    max-accounts-per-owner: ${TELEX_TELEGRAM_MAX_ACCOUNTS_PER_OWNER:3}
    sessions-dir: ${TELEX_TELEGRAM_SESSIONS_DIR:/var/lib/telex/tdlib}
  public-url: ${TELEX_PUBLIC_URL:http://localhost:8080}
  mail:
    from: ${TELEX_MAIL_FROM:teleX <no-reply@localhost>}
  llm:
    attempt-timeout: 60s
    openrouter:
      api-key: ${TELEX_OPENROUTER_API_KEY:}
      base-url: https://openrouter.ai/api/v1
    catalog:
      refresh-interval: 24h
      retry-interval: 5m
  models:
    # Shipped models of the system profiles; an Operator override replaces a whole slot (up to three ids).
    system-profiles:
      fast:
        text: [google/gemini-3.5-flash-lite]
        vision: [google/gemini-3.5-flash-lite]
        image: [google/gemini-3.1-flash-lite-image]
      balanced:
        text: [google/gemini-3.5-flash]
        vision: [google/gemini-3.5-flash]
        image: [google/gemini-3.1-flash-image]
      careful:
        text: [anthropic/claude-sonnet-5]
        vision: [anthropic/claude-sonnet-5]
        image: [google/gemini-3-pro-image]
