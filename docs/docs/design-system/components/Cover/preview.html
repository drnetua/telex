<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  body { margin: 0; padding: 0; background: var(--bg-body); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg-body); font-family: var(--font-sans); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .primary { fill: var(--primary); } .ai { fill: var(--ai); } .ink { fill: var(--text-heading); } .ok { fill: var(--success); } .tint { fill: var(--primary-subtle); } .warn { fill: var(--warning); }
  .name { position: absolute; left: 48px; bottom: 64px; margin: 0; font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: -0.03em; color: var(--text-heading); }
  .tag { position: absolute; left: 52px; bottom: 36px; margin: 0; max-width: 420px; font-size: 14px; color: var(--text-secondary); }
</style></head>
<body>
<div class="cv">
  <!-- blocks: primary 216x152 radius-lg, ai 152x104, text-heading slab 104x248, success 104x72, primary-subtle tint 216x72, warning 48x48 (steps of 8 / space-3..6)
       arrangement: modular dashboard grid right of x=480, like Tabler cards, one card merged two-wide
       pattern row: "geometric, modular, dense UI" -> tiles cut by radius-lg / radius-md, because teleX is an operator's dashboard built on Tabler
       steps and radii: gap 16 (space-3), radius-lg 8, radius-md 6, radius-pill for the status dot -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="primary" x="496" y="24" width="216" height="152" rx="8"/>
    <rect class="ink" x="728" y="24" width="104" height="248" rx="8"/>
    <rect class="ai" x="848" y="24" width="152" height="104" rx="8"/>
    <rect class="ok" x="848" y="144" width="104" height="72" rx="8"/>
    <rect class="tint" x="496" y="192" width="216" height="80" rx="8"/>
    <rect class="warn" x="848" y="232" width="48" height="40" rx="6"/>
    <circle class="tint" cx="760" cy="56" r="8"/>
    <rect class="tint" x="752" y="80" width="56" height="8" rx="4"/>
    <rect class="tint" x="752" y="100" width="40" height="8" rx="4"/>
  </svg>
  <p class="name">teleX</p>
  <p class="tag">Your Telegram, with assistants you stay in charge of.</p>
</div>
</body>
</html>
