# Local Postgres + pgvector for the `local` profile. Set TELEX_DB_PORT if 5432 is taken.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: telex
      POSTGRES_USER: telex
      POSTGRES_PASSWORD: telex
    ports:
      - "${TELEX_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telex -d telex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
