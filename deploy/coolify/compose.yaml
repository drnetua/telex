# The teleX installation as a Coolify service on lhost. Rendered and pushed by scripts/deploy-coolify.sh:
# __IMAGE__, __APP_PORT__, __MAIL_UI_PORT__ and __PUBLIC_URL__ are replaced before upload.
# SERVICE_PASSWORD_POSTGRES is a Coolify magic variable: generated once, kept across deploys.
services:
  app:
    image: __IMAGE__
    ports:
      - "__APP_PORT__:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telex
      SPRING_DATASOURCE_USERNAME: telex
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      TELEX_MAIL_HOST: mailpit
      TELEX_MAIL_PORT: "1025"
      TELEX_PUBLIC_URL: __PUBLIC_URL__
    # The JRE image has no curl, so the probe is a plain HTTP request over bash (as in the root compose.yaml).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Local mailbox until real SMTP is configured: every sign-in email lands here (UI on the LAN only).
  mailpit:
    image: axllent/mailpit
    ports:
      - "__MAIL_UI_PORT__:8025"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: telex
      POSTGRES_USER: telex
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - telex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telex -d telex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  telex-postgres-data:
