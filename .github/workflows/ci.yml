name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (with pnpm store cache)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      # build = compile + unit tests + spotlessCheck + detekt + pnpm check + pnpm build;
      # integrationTest = Testcontainers (Docker is available on ubuntu-latest).
      - name: Build and test
        run: ./gradlew build integrationTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (with pnpm store cache)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Start the stack (app with the e2e profile and the fake Telegram adapter, Postgres, Mailpit, fake OpenRouter)
        env:
          TELEX_TELEGRAM_ADAPTER: fake
          TELEX_TELEGRAM_API_ID: "1"
          TELEX_TELEGRAM_API_HASH: ci-fake-hash
          TELEX_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: docker compose -f compose.yaml -f compose.e2e.yaml --profile unconfigured up -d --build --wait

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @telex/e2e exec playwright install --with-deps chromium

      - name: Type-check the e2e package
        run: pnpm --filter @telex/e2e run check

      - name: Run Playwright at 360 px and 1280 px
        run: pnpm --filter @telex/e2e test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.e2e.yaml --profile unconfigured down -v
