name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (with pnpm store cache)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      # build = compile + unit tests + spotlessCheck + detekt + pnpm check + pnpm build;
      # integrationTest = Testcontainers (Docker is available on ubuntu-latest).
      - name: Build and test
        run: ./gradlew build integrationTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/
